<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Heat Input Master icon</title>
  <desc id="desc">A welding arc over a joint with a heat-input formula badge.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="80" x2="704" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1220"/>
      <stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8595a6"/>
      <stop offset="1" stop-color="#3d4a58"/>
    </linearGradient>
    <radialGradient id="arc" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#e0f2ff"/>
      <stop offset=".6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bead" x1="140" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".4" stop-color="#fb923c"/>
      <stop offset=".7" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="168" fill="url(#bg)"/>

  <!-- Two steel plates forming a joint -->
  <g filter="url(#shadow)">
    <rect x="110" y="470" width="300" height="150" rx="14" fill="url(#steel)"/>
    <rect x="390" y="470" width="300" height="150" rx="14" fill="url(#steel)"/>
  </g>

  <!-- Weld bead across the joint -->
  <path d="M150 486 h500" stroke="url(#bead)" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M150 486 h500" stroke="#fffbeb" stroke-opacity=".5" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Electrode -->
  <g stroke-linecap="round">
    <path d="M470 150 L400 430" stroke="#0f172a" stroke-width="30"/>
    <path d="M470 150 L400 430" stroke="#64748b" stroke-width="14"/>
    <path d="M406 408 L400 462" stroke="#f8fafc" stroke-width="9"/>
  </g>

  <!-- Arc glow at the tip -->
  <circle cx="400" cy="486" r="120" fill="url(#arc)"/>
  <g stroke="#e0f2ff" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M400 470 l-16 34 l26 -10 l-14 40"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="300" cy="560" r="6"/>
    <circle cx="520" cy="548" r="7"/>
    <circle cx="470" cy="600" r="5"/>
    <circle cx="330" cy="612" r="5"/>
  </g>

  <!-- Formula badge -->
  <g transform="translate(150 150)">
    <rect x="0" y="0" width="330" height="120" rx="26" fill="#f8fafc" opacity=".97" filter="url(#shadow)"/>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <text x="165" y="56" fill="#0f172a" font-weight="800" font-size="52">Q = U·I·k / v</text>
      <text x="165" y="94" fill="#b45309" font-weight="700" font-size="30">kJ / mm</text>
    </g>
  </g>
</svg>
