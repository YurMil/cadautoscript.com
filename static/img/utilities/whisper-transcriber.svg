<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Whisper Transcriber icon</title>
  <desc id="desc">A waveform turning into lines of transcribed text next to a microphone.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="80" x2="704" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131c33"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="wave" x1="150" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="168" fill="url(#bg)"/>
  <path d="M110 604h580M110 485h580M110 366h580M110 247h580" fill="none" stroke="#1f2b4a" stroke-width="2"/>
  <path d="M190 132v536M310 132v536M430 132v536M550 132v536" fill="none" stroke="#1f2b4a" stroke-width="2"/>

  <g stroke="url(#wave)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)">
    <path d="M168 300v56"/>
    <path d="M222 258v140"/>
    <path d="M276 208v240"/>
    <path d="M330 268v120"/>
    <path d="M384 180v296"/>
    <path d="M438 250v156"/>
    <path d="M492 214v228"/>
    <path d="M546 272v112"/>
    <path d="M600 296v64"/>
  </g>

  <g stroke="#e2e8f0" stroke-width="20" stroke-linecap="round" opacity=".9">
    <path d="M168 546h300"/>
    <path d="M168 614h404"/>
  </g>
  <g stroke="#64748b" stroke-width="20" stroke-linecap="round" opacity=".7">
    <path d="M512 546h120"/>
    <path d="M616 614h16"/>
  </g>

  <g transform="translate(556 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="88" height="140" rx="44" fill="#f8fafc"/>
    <path d="M-24 96a68 68 0 0 0 136 0" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
    <path d="M44 164v40" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
