<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flg_bg" x1="0" y1="0" x2="1024" y2="1024">
      <stop stop-color="#05101A"/>
      <stop offset="1" stop-color="#02060B"/>
    </linearGradient>
    <filter id="flg_neonBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="flg_neonGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .tile { transition: all 0.3s; transform-origin: center; transform-box: fill-box; }
    .flange-inner { transition: all 0.3s; transform-origin: center; transform-box: fill-box; }
    .status-light { transition: all 0.3s; }

    /* Total loop: 12 seconds */
    /* Simon matches sequence: Tile 1 (1s), Tile 5 (2.5s), Tile 9 (4s) */
    /* Player inputs matching sequence: Tile 1 (6s), Tile 5 (7.5s), Tile 9 (9s) */
    /* Success: All tiles turn green (10s to 11.5s) */

    svg:hover .simon-1 { animation: highlightBlue 12s infinite; animation-delay: 1s; }
    svg:hover .simon-2 { animation: highlightBlue 12s infinite; animation-delay: 2.5s; }
    svg:hover .simon-3 { animation: highlightBlue 12s infinite; animation-delay: 4s; }

    svg:hover .player-1 { animation: pressBlue 12s infinite; animation-delay: 6s; }
    svg:hover .player-2 { animation: pressBlue 12s infinite; animation-delay: 7.5s; }
    svg:hover .player-3 { animation: pressBlue 12s infinite; animation-delay: 9s; }

    svg:hover .all-tiles { animation: successGreen 12s infinite; animation-delay: 10s; }
    svg:hover .status-indicator { animation: indicatorGreen 12s infinite; animation-delay: 10s; }

    @keyframes highlightBlue {
      0% { transform: scale(1); filter: none; }
      5% { transform: scale(1.15); filter: url(#flg_neonBlue); }
      15% { transform: scale(1); filter: none; }
      100% { transform: scale(1); filter: none; }
    }
    @keyframes pressBlue {
      0% { transform: scale(1) rotate(0deg); filter: none; }
      5% { transform: scale(0.9) rotate(90deg); filter: url(#flg_neonBlue); }
      15% { transform: scale(1) rotate(90deg); filter: none; }
      100% { transform: scale(1) rotate(90deg); filter: none; }
    }
    @keyframes successGreen {
      0%, 15% { filter: none; fill: #1C3056; stroke: #4BE4FF; }
      2%, 10% { filter: url(#flg_neonGreen); fill: #10B981; stroke: #34D399; }
      100% { filter: none; }
    }
    @keyframes indicatorGreen {
      0%, 15% { fill: #334155; }
      2%, 10% { fill: #10B981; filter: drop-shadow(0 0 10px #10B981); }
      100% { fill: #334155; }
    }
  </style>

  <rect width="1024" height="1024" rx="64" fill="url(#flg_bg)"/>

  <!-- Background decorative UI -->
  <rect x="112" y="112" width="800" height="800" rx="40" stroke="#1E293B" stroke-width="8" fill="#0A111E"/>
  <circle cx="512" cy="150" r="15" fill="#334155" class="status-indicator"/>

  <!-- 3x3 Flange Grid -->
  <g transform="translate(192, 212)">
    <!-- Row 1 -->
    <g transform="translate(40, 40)" class="tile simon-1 player-1 all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
    <g transform="translate(240, 40)" class="tile all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
    <g transform="translate(440, 40)" class="tile all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(40, 240)" class="tile all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
    <g transform="translate(240, 240)" class="tile simon-2 player-2 all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
    <g transform="translate(440, 240)" class="tile all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(40, 440)" class="tile all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
    <g transform="translate(240, 440)" class="tile all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
    <g transform="translate(440, 440)" class="tile simon-3 player-3 all-tiles">
      <circle cx="80" cy="80" r="70" fill="#1C3056" stroke="#4BE4FF" stroke-width="4"/>
      <circle cx="80" cy="80" r="40" fill="none" stroke="#4BE4FF" stroke-width="8" stroke-dasharray="25 15" class="flange-inner"/>
      <circle cx="80" cy="80" r="15" fill="#4BE4FF"/>
    </g>
  </g>
</svg>
