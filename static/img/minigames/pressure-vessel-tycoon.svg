<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prv_bg" x1="0" y1="0" x2="0" y2="1024">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="prv_iron" x1="0" y1="0" x2="0" y2="100%">
      <stop stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="prv_glowSparks">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .gear { transform-origin: center; transform-box: fill-box; }
    .belt-line { stroke-dasharray: 40 40; stroke-dashoffset: 0; }
    
    /* 10s full factory loop */
    svg:hover .gear-fast { animation: spin 4s linear infinite; }
    svg:hover .gear-slow { animation: spinReverse 8s linear infinite; }
    svg:hover .belt-line { animation: moveBelt 2s linear infinite; }

    /* The raw material sheet comes in, gets welded, becomes a vessel, moves out */
    .raw-material { opacity: 0; transform: translateX(-300px); }
    .finished-vessel { opacity: 0; transform: translateX(200px); }
    .spark { opacity: 0; }
    .gauge-needle { transform-origin: bottom; transform: rotate(-45deg); }

    svg:hover .raw-material { animation: transportRaw 10s linear infinite; }
    svg:hover .welder-arm { animation: weldAction 10s linear infinite; transform-origin: top; }
    svg:hover .spark { animation: shootSparks 10s infinite; }
    svg:hover .finished-vessel { animation: transportFinished 10s linear infinite; }
    svg:hover .gauge-needle { animation: pressureBuild 10s infinite; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
    @keyframes moveBelt { 100% { stroke-dashoffset: -80; } }

    @keyframes transportRaw {
      0% { opacity: 1; transform: translateX(-300px); }
      30% { opacity: 1; transform: translateX(200px); } /* Reaches welder */
      50% { opacity: 1; transform: translateX(200px); } /* Wait for weld */
      51%, 100% { opacity: 0; transform: translateX(200px); } /* Converts to finished */
    }

    @keyframes weldAction {
      0%, 25% { transform: translateY(-50px); }
      30%, 50% { transform: translateY(10px); } /* Comes down */
      55%, 100% { transform: translateY(-50px); } /* Goes up */
    }

    @keyframes shootSparks {
      0%, 30% { opacity: 0; }
      31%, 35%, 39%, 43%, 47% { opacity: 1; transform: translate(10px, -10px) scale(1.5); }
      33%, 37%, 41%, 45%, 49% { opacity: 0.5; transform: translate(-10px, 10px) scale(0.8); }
      50%, 100% { opacity: 0; }
    }

    @keyframes transportFinished {
      0%, 50% { opacity: 0; transform: translateX(200px); }
      51% { opacity: 1; transform: translateX(200px); }
      80%, 100% { opacity: 1; transform: translateX(900px); }
    }

    @keyframes pressureBuild {
      0%, 50% { transform: rotate(-45deg); }
      55% { transform: rotate(45deg); } /* Presure goes up as vessel finishes */
      80% { transform: rotate(45deg); }
      85%, 100% { transform: rotate(-45deg); } /* Resets */
    }
  </style>

  <rect width="1024" height="1024" rx="64" fill="url(#prv_bg)"/>

  <!-- Factory pipes back layer -->
  <path d="M 0 200 L 1024 200 M 0 850 L 1024 850" stroke="#1E293B" stroke-width="40"/>

  <!-- Giant Gears -->
  <g transform="translate(150, 400)" class="gear gear-slow">
    <circle cx="0" cy="0" r="140" fill="#334155"/>
    <circle cx="0" cy="0" r="90" fill="#0F172A"/>
    <path d="M -30 -160 L 30 -160 L 30 -140 L -30 -140 Z M -30 140 L 30 140 L 30 160 L -30 160 Z M -160 -30 L -140 -30 L -140 30 L -160 30 Z M 140 -30 L 160 -30 L 160 30 L 140 30 Z" fill="#334155"/>
  </g>
  <g transform="translate(850, 480)" class="gear gear-fast">
    <circle cx="0" cy="0" r="100" fill="#475569"/>
    <circle cx="0" cy="0" r="60" fill="#0F172A"/>
    <path d="M -20 -120 L 20 -120 L 20 -100 L -20 -100 Z M -20 100 L 20 100 L 20 120 L -20 120 Z M -120 -20 L -100 -20 L -100 20 L -120 20 Z M 100 -20 L 120 -20 L 120 20 L 100 20 Z" fill="#475569"/>
  </g>

  <!-- Conveyor System -->
  <g transform="translate(50, 700)">
    <rect x="0" y="0" width="924" height="60" fill="#1E293B" rx="30"/>
    <path d="M 30 30 L 894 30" stroke="#0EA5E9" stroke-width="15" stroke-linecap="round" class="belt-line"/>
  </g>

  <!-- Animator: Raw Material -->
  <g class="raw-material" transform="translate(0, 580)">
    <rect x="100" y="0" width="200" height="100" fill="#64748B" rx="10"/>
    <rect x="120" y="20" width="160" height="10" fill="#94A3B8"/>
    <rect x="120" y="50" width="160" height="10" fill="#94A3B8"/>
  </g>

  <!-- Welder Arm Structure -->
  <g transform="translate(412, 100)">
    <rect x="-30" y="0" width="60" height="300" fill="#475569"/>
    <g class="welder-arm">
      <rect x="-20" y="300" width="40" height="150" fill="#F59E0B"/>
      <!-- welder tip -->
      <polygon points="-10,450 10,450 0,480" fill="#EF4444"/>
      <!-- Sparks -->
      <circle cx="-15" cy="490" r="8" fill="#FEF08A" class="spark" filter="url(#prv_glowSparks)"/>
      <circle cx="15" cy="500" r="10" fill="#FCD34D" class="spark" filter="url(#prv_glowSparks)"/>
      <circle cx="0" cy="510" r="12" fill="#FDE047" class="spark" filter="url(#prv_glowSparks)"/>
    </g>
  </g>

  <!-- Animator: Finished Pressure Vessel -->
  <g class="finished-vessel" transform="translate(0, 480)">
    <rect x="50" y="0" width="280" height="200" rx="100" fill="url(#prv_iron)"/>
    <!-- Tank Bands -->
    <path d="M 120 0 L 120 200 M 260 0 L 260 200" stroke="#0F172A" stroke-width="15"/>
    <!-- Center Gauge for the vessel -->
    <circle cx="190" cy="100" r="40" fill="#F8FAFC" stroke="#F59E0B" stroke-width="10"/>
    <path d="M 190 100 L 190 70" stroke="#EF4444" stroke-width="6" stroke-linecap="round" class="gauge-needle"/>
    <circle cx="190" cy="100" r="8" fill="#0F172A"/>
  </g>

  <!-- Control HUD -->
  <rect x="50" y="50" width="200" height="100" rx="20" fill="#1E293B" stroke="#0EA5E9" stroke-width="4"/>
  <circle cx="100" cy="100" r="15" fill="#10B981"/>
  <circle cx="150" cy="100" r="15" fill="#EF4444"/>
</svg>
