<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CadAutoscript — Animated Logo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(ellipse at 50% 40%, #0c1830 0%, #040810 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
svg#logo {
  width: min(90vw, 90vh);
  height: min(90vw, 90vh);
  overflow: visible;
}

/* ── Gear rotations ──────────────────────────────── */
@keyframes cw  { to { transform: rotate(360deg);  } }
@keyframes ccw { to { transform: rotate(-360deg); } }

.gear-frame { transform-box:fill-box; transform-origin:center; animation:cw  80s linear infinite; }
.gear1      { transform-box:fill-box; transform-origin:center; animation:cw  12s linear infinite; }
.gear2      { transform-box:fill-box; transform-origin:center; animation:ccw 8.25s linear infinite; }
.gear3      { transform-box:fill-box; transform-origin:center; animation:ccw 6s   linear infinite; }
.gear4      { transform-box:fill-box; transform-origin:center; animation:cw  4.4s linear infinite; }

/* ── Circuit traces ──────────────────────────────── */
@keyframes trace {
  0%   { stroke-dashoffset:420; opacity:0;   }
  6%   { opacity:0.95; }
  88%  { opacity:0.88; }
  100% { stroke-dashoffset:0;   opacity:0;   }
}
.ct {
  fill:none;
  stroke-dasharray:80 420;
  animation:trace 5s ease-in-out infinite;
}

/* ── Node dots ───────────────────────────────────── */
@keyframes nodePulse {
  0%,100% { r:2;   opacity:0.3; }
  50%     { r:3.8; opacity:1;   }
}
.cdot { animation:nodePulse 2.8s ease-in-out infinite; }

/* ── Scan sweep ──────────────────────────────────── */
@keyframes sweep {
  0%   { transform:rotate(-170deg); opacity:0;   }
  4%   { opacity:1; }
  96%  { opacity:0.9; }
  100% { transform:rotate(170deg);  opacity:0;   }
}
.scan { transform-box:fill-box; transform-origin:center; animation:sweep 8s ease-in-out infinite; }
</style>
</head>

<svg id="logo" viewBox="0 0 600 680" xmlns="http://www.w3.org/2000/svg">

    <stop offset="100%" stop-color="#04081a"  stop-opacity="0.72"/>
  </radialGradient>

  <!-- ── Filters ─────────────────────────────────── -->
  <filter id="glow"  x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="5"  result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">

    <feFlood flood-color="#1a60d8" flood-opacity="0.55" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textFX" x="-8%" y="-15%" width="116%" height="145%">

    <feComposite in="c" in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="drop" x="-12%" y="-8%" width="124%" height="124%">

  </filter>

  </clipPath>

  <path id="barc" d="M 150,550 Q 300,592 450,550"/>

</defs>

<script>
// ── Smooth involute-style gear path using quadratic beziers ──────────────
function gearPath(cx, cy, teeth, outerR, innerR) {
  const step = (Math.PI * 2) / teeth;
  const arc  = step * 0.19;
  const mid  = (outerR + innerR) / 2;
  let d = '';
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    // valley-to-tooth: quadratic bezier with control point at mid radius
    const v1  = [cx + innerR * Math.cos(a - arc*1.65), cy + innerR * Math.sin(a - arc*1.65)];
    const cp1 = [cx + mid    * Math.cos(a - arc*1.1),  cy + mid    * Math.sin(a - arc*1.1)];
    const t1  = [cx + outerR * Math.cos(a - arc*0.42), cy + outerR * Math.sin(a - arc*0.42)];
    const t2  = [cx + outerR * Math.cos(a + arc*0.42), cy + outerR * Math.sin(a + arc*0.42)];
    const cp2 = [cx + mid    * Math.cos(a + arc*1.1),  cy + mid    * Math.sin(a + arc*1.1)];
    const v2  = [cx + innerR * Math.cos(a + arc*1.65), cy + innerR * Math.sin(a + arc*1.65)];
    const f = p => p[0].toFixed(2)+','+p[1].toFixed(2);
    if (i === 0) d += `M${f(v1)}`; else d += `L${f(v1)}`;
    d += ` Q${f(cp1)} ${f(t1)} L${f(t2)} Q${f(cp2)} ${f(v2)}`;
  }
  return d + 'Z';
}

// Highlight path: just the outer-radius arc of each tooth top
function gearHighlightPath(cx, cy, teeth, outerR) {
  const step = (Math.PI * 2) / teeth;
  const arc  = step * 0.19;
  let d = '';
  for (let i = 0; i < teeth; i++) {
    const a  = i * step;
    const t1 = [cx + outerR * Math.cos(a - arc*0.42), cy + outerR * Math.sin(a - arc*0.42)];
    const t2 = [cx + outerR * Math.cos(a + arc*0.42), cy + outerR * Math.sin(a + arc*0.42)];
    d += `M${t1[0].toFixed(2)},${t1[1].toFixed(2)} L${t2[0].toFixed(2)},${t2[1].toFixed(2)}`;
  }
  return d;
}

// Frame gear: outer gear + inner CCW circle punch-out
function frameGear(cx, cy, teeth, outerR, innerR, holeR) {
  let d = gearPath(cx, cy, teeth, outerR, innerR);
  d += ` M${(cx+holeR).toFixed(2)},${cy}`
     + ` A${holeR},${holeR} 0 0 0 ${(cx-holeR).toFixed(2)},${cy}`
     + ` A${holeR},${holeR} 0 0 0 ${(cx+holeR).toFixed(2)},${cy}Z`;
  return d;
}

// ── Apply paths ──────────────────────────────────────────────────────────
// Frame gear: 22 teeth, large
document.getElementById('fgp').setAttribute('d', frameGear(300, 308, 22, 232, 202, 194));

// Gear 1: 16t, center (340,288)
document.getElementById('g1t').setAttribute('d', gearPath(340, 288, 16, 80, 64));
document.getElementById('g1h').setAttribute('d', gearHighlightPath(340, 288, 16, 80));

// Gear 2: 11t, center (248,372) — meshes with G1 (dist≈119, pitches≈71+46=117)
document.getElementById('g2t').setAttribute('d', gearPath(248, 372, 11, 50, 40));
document.getElementById('g2h').setAttribute('d', gearHighlightPath(248, 372, 11, 50));

// Gear 3: 8t, center (398,372) — meshes with G1 (dist≈100, pitches≈71+32=103)

document.getElementById('g3h').setAttribute('d', gearHighlightPath(398, 372, 8, 36));

// Gear 4: 7t, center (365,432) — meshes with G3 (dist≈65, pitches≈32+32=64)
document.getElementById('g4t').setAttribute('d', gearPath(365, 432, 7, 28, 22));
document.getElementById('g4h').setAttribute('d', gearHighlightPath(365, 432, 7, 28));
</script>
